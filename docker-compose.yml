services:
  drawio:
    restart: unless-stopped
    image: jgraph/drawio:latest
    ports: ["8086:8080"]
    environment:
      - DRAWIO_CONFIG={"lockdown":true,"enableAi":false,"status":"","services":{"gdrive":false,"dropbox":false,"onedrive":false,"github":false,"gitlab":false}}
  next-ai-draw-io:
    restart: unless-stopped
    build:
      context: .
      args:
        - NEXT_PUBLIC_DRAWIO_BASE_URL=http://localhost:8086
        # Uncomment below for subdirectory deployment
        # - NEXT_PUBLIC_BASE_PATH=/nextaidrawio
    ports: ["3000:3000"]
    env_file: .env
    # environment:
    #   # For subdirectory deployment, uncomment and set your path:
    #   NEXT_PUBLIC_BASE_PATH: /nextaidrawio
    depends_on: [drawio]
